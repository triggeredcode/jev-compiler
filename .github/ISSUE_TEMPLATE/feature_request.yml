name: Feature request
description: Propose a focused improvement to Jev Compiler.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision-compilation problem or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior, including CLI or artifact changes when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you considered?
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How could the behavior be tested or measured?
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The proposal keeps candidate programs declarative and safely interpretable.
          required: true
        - label: The proposal does not require paid model usage by default.
          required: true
