name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv build
      - run: python scripts/verify_distribution.py dist
      - run: uv venv .package-smoke
      - run: uv pip install --python .package-smoke/bin/python dist/*.whl
      - run: .package-smoke/bin/jevcompiler --help
      - run: >-
          .package-smoke/bin/python -c
          "from importlib.resources import files;
          assert files('jevcompiler.freeze').joinpath('runtime.ts').is_file()"
