name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: python scripts/verify_distribution.py dist
      - run: uv venv .package-smoke
      - run: uv pip install --python .package-smoke/bin/python dist/*.whl
      - run: .package-smoke/bin/jevcompiler --help
      - run: >-
          .package-smoke/bin/python -c
          "from importlib.resources import files;
          assert files('jevcompiler.freeze').joinpath('runtime.ts').is_file()"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build compiler image
        run: docker compose build compiler
      - name: Run offline showcase in hardened container
        run: >-
          docker compose run --rm compiler showcase
          --output /workspace/.jevcompiler/ci-showcase
      - name: Remove test volumes
        if: always()
        run: docker compose down --volumes
