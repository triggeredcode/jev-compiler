name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv build
      - run: python scripts/verify_distribution.py dist
      - run: uv venv .package-smoke
      - run: uv pip install --python .package-smoke/bin/python dist/*.whl
      - run: .package-smoke/bin/jevcompiler --help
      - run: >-
          .package-smoke/bin/python -c
          "from importlib.resources import files;
          assert files('jevcompiler.freeze').joinpath('runtime.ts').is_file()"
