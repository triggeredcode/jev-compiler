<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Jev Compiler pipeline</title>
  <desc id="desc">Decision policies flow through evidence, typed Jev graphs, evaluation, and verified deployment artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111b34"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="70" r="180" fill="#7c3aed" opacity="0.12"/>
  <circle cx="80" cy="500" r="210" fill="#0ea5e9" opacity="0.09"/>
  <text x="72" y="86" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700">Jev Compiler</text>
  <text x="72" y="126" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Decision policies in. Inspectable, measurable Jev programs out.</text>
  <rect x="72" y="154" width="1056" height="3" rx="2" fill="url(#accent)" opacity="0.9"/>
  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(72 211)">
      <rect width="190" height="180" rx="20" fill="#0f172a" stroke="#334155"/>
      <circle cx="34" cy="35" r="13" fill="#38bdf8"/>
      <text x="58" y="42" fill="#e2e8f0" font-size="18" font-weight="650">Policy</text>
      <text x="24" y="85" fill="#94a3b8" font-size="15">Natural-language</text>
      <text x="24" y="108" fill="#94a3b8" font-size="15">decision goals,</text>
      <text x="24" y="131" fill="#94a3b8" font-size="15">constraints, actions</text>
    </g>
    <path d="M274 301h34" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="m300 293 10 8-10 8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(320 211)">
      <rect width="190" height="180" rx="20" fill="#0f172a" stroke="#334155"/>
      <circle cx="34" cy="35" r="13" fill="#22c55e"/>
      <text x="58" y="42" fill="#e2e8f0" font-size="18" font-weight="650">Evidence</text>
      <text x="24" y="85" fill="#94a3b8" font-size="15">Cases, provenance,</text>
      <text x="24" y="108" fill="#94a3b8" font-size="15">splits, counterfactuals,</text>
      <text x="24" y="131" fill="#94a3b8" font-size="15">failure corpus</text>
    </g>
    <path d="M522 301h34" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="m548 293 10 8-10 8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(568 211)">
      <rect width="190" height="180" rx="20" fill="#0f172a" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="34" cy="35" r="13" fill="#a78bfa"/>
      <text x="58" y="42" fill="#f5f3ff" font-size="18" font-weight="650">Typed Jev graph</text>
      <text x="24" y="85" fill="#c4b5fd" font-size="15">Choice · Score · Noul</text>
      <text x="24" y="108" fill="#94a3b8" font-size="15">Batched questions,</text>
      <text x="24" y="131" fill="#94a3b8" font-size="15">branches, thresholds</text>
    </g>
    <path d="M770 301h34" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="m796 293 10 8-10 8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(816 211)">
      <rect width="312" height="180" rx="20" fill="#0f172a" stroke="#334155"/>
      <circle cx="34" cy="35" r="13" fill="#f59e0b"/>
      <text x="58" y="42" fill="#e2e8f0" font-size="18" font-weight="650">Verified artifact</text>
      <text x="24" y="84" fill="#94a3b8" font-size="15">✓ Immutable program + manifest</text>
      <text x="24" y="109" fill="#94a3b8" font-size="15">✓ Python + TypeScript runtimes</text>
      <text x="24" y="134" fill="#94a3b8" font-size="15">✓ Metrics, lineage + HTML report</text>
    </g>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">
    <rect x="72" y="438" width="208" height="38" rx="19" fill="#082f49" stroke="#0ea5e9"/>
    <text x="176" y="463" text-anchor="middle" fill="#bae6fd">Local-first teacher routing</text>
    <rect x="296" y="438" width="190" height="38" rx="19" fill="#052e16" stroke="#22c55e"/>
    <text x="391" y="463" text-anchor="middle" fill="#bbf7d0">Bounded evaluation</text>
    <rect x="502" y="438" width="182" height="38" rx="19" fill="#2e1065" stroke="#8b5cf6"/>
    <text x="593" y="463" text-anchor="middle" fill="#ddd6fe">Safe interpretation</text>
    <rect x="700" y="438" width="202" height="38" rx="19" fill="#451a03" stroke="#f59e0b"/>
    <text x="801" y="463" text-anchor="middle" fill="#fde68a">Digest verification</text>
  </g>
</svg>
