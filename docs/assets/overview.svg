<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">From decision policy to verified Jev artifact</title>
  <desc id="desc">A four-stage pipeline moves from a policy through evidence and a typed Jev graph to a verified Python and TypeScript artifact.</desc>
  <defs>
    <linearGradient id="background" x1="42" y1="18" x2="1158" y2="582" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071321"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#18123a"/>
    </linearGradient>
    <linearGradient id="headline" x1="70" y1="0" x2="750" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#201a43"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.08"/>
    </pattern>
    <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="598" rx="30" fill="url(#background)" stroke="#273449" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="598" rx="30" fill="url(#grid)"/>
  <circle cx="1080" cy="74" r="168" fill="#7c3aed" opacity="0.11"/>
  <circle cx="112" cy="572" r="190" fill="#0284c7" opacity="0.08"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="64" y="48" width="202" height="32" rx="16" fill="#0c2741" stroke="#0ea5e9" stroke-opacity="0.55"/>
    <circle cx="83" cy="64" r="4" fill="#38bdf8"/>
    <text x="97" y="69" fill="#bae6fd" font-size="13" font-weight="650" letter-spacing="1.2">LOCAL-FIRST COMPILER</text>

    <text x="64" y="137" fill="url(#headline)" font-size="46" font-weight="760" letter-spacing="-1.3">Compile policy into proof.</text>
    <text x="64" y="177" fill="#9caec4" font-size="19">Evidence in every stage. A portable program at the end.</text>

    <g transform="translate(1062 84)">
      <circle cx="0" cy="0" r="5" fill="#f8fafc"/>
      <path d="M0 0-34-24M0 0 35-25M0 0v45" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-34" cy="-24" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="35" cy="-25" r="10" fill="#0f172a" stroke="#a78bfa" stroke-width="4"/>
      <circle cx="0" cy="45" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
    </g>

    <rect x="64" y="211" width="1072" height="2" rx="1" fill="url(#accent)" opacity="0.8"/>

    <g filter="url(#card-shadow)">
      <g transform="translate(53 247)">
        <rect width="245" height="230" rx="22" fill="#0d1727" stroke="#2b3b50"/>
        <rect x="22" y="22" width="44" height="28" rx="14" fill="#082f49" stroke="#0ea5e9" stroke-opacity="0.75"/>
        <text x="44" y="41" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="750">01</text>
        <circle cx="207" cy="36" r="9" fill="#38bdf8"/>
        <text x="22" y="92" fill="#f8fafc" font-size="20" font-weight="700">Policy input</text>
        <text x="22" y="130" fill="#9caec4" font-size="15">State and actions</text>
        <text x="22" y="157" fill="#9caec4" font-size="15">Rules and constraints</text>
        <rect x="22" y="188" width="112" height="24" rx="12" fill="#12263c"/>
        <text x="78" y="205" text-anchor="middle" fill="#bae6fd" font-size="12">TaskSpec</text>
      </g>

      <g transform="translate(336 247)">
        <rect width="245" height="230" rx="22" fill="#0d1727" stroke="#2b3b50"/>
        <rect x="22" y="22" width="44" height="28" rx="14" fill="#052e27" stroke="#10b981" stroke-opacity="0.75"/>
        <text x="44" y="41" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="750">02</text>
        <circle cx="207" cy="36" r="9" fill="#34d399"/>
        <text x="22" y="92" fill="#f8fafc" font-size="20" font-weight="700">Evidence</text>
        <text x="22" y="130" fill="#9caec4" font-size="15">Cases and provenance</text>
        <text x="22" y="157" fill="#9caec4" font-size="15">Train · dev · test</text>
        <rect x="22" y="188" width="130" height="24" rx="12" fill="#0e2c29"/>
        <text x="87" y="205" text-anchor="middle" fill="#a7f3d0" font-size="12">content-addressed</text>
      </g>

      <g transform="translate(619 247)">
        <rect width="245" height="230" rx="22" fill="url(#selected)" stroke="#8b5cf6" stroke-width="2"/>
        <circle cx="122" cy="116" r="94" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
        <rect x="22" y="22" width="44" height="28" rx="14" fill="#2e1065" stroke="#8b5cf6"/>
        <text x="44" y="41" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="750">03</text>
        <circle cx="207" cy="36" r="9" fill="#a78bfa"/>
        <text x="22" y="92" fill="#ffffff" font-size="20" font-weight="700">Typed Jev graph</text>
        <text x="22" y="130" fill="#c4b5fd" font-size="15">Choice · Score · Noul</text>
        <text x="22" y="157" fill="#b6a8d9" font-size="15">Thresholds and branches</text>
        <rect x="22" y="188" width="144" height="24" rx="12" fill="#2b1b50"/>
        <text x="94" y="205" text-anchor="middle" fill="#ddd6fe" font-size="12">safe interpretation</text>
      </g>

      <g transform="translate(902 247)">
        <rect width="245" height="230" rx="22" fill="#0d1727" stroke="#2b3b50"/>
        <rect x="22" y="22" width="44" height="28" rx="14" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.8"/>
        <text x="44" y="41" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="750">04</text>
        <circle cx="207" cy="36" r="9" fill="#f59e0b"/>
        <text x="22" y="92" fill="#f8fafc" font-size="20" font-weight="700">Verified artifact</text>
        <text x="22" y="130" fill="#9caec4" font-size="15">Python and TypeScript</text>
        <text x="22" y="157" fill="#9caec4" font-size="15">Digests and HTML report</text>
        <rect x="22" y="188" width="126" height="24" rx="12" fill="#35210c"/>
        <text x="85" y="205" text-anchor="middle" fill="#fde68a" font-size="12">attested release</text>
      </g>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M307 362h17"/>
      <path d="m318 355 8 7-8 7"/>
      <path d="M590 362h17"/>
      <path d="m601 355 8 7-8 7"/>
      <path d="M873 362h17"/>
      <path d="m884 355 8 7-8 7"/>
    </g>

    <g font-size="13" font-weight="600">
      <rect x="64" y="521" width="250" height="36" rx="18" fill="#0c2741" stroke="#164e63"/>
      <circle cx="85" cy="539" r="4" fill="#38bdf8"/>
      <text x="99" y="544" fill="#bae6fd">Ollama → LM Studio → OpenRouter</text>

      <rect x="330" y="521" width="178" height="36" rx="18" fill="#10271d" stroke="#14532d"/>
      <circle cx="351" cy="539" r="4" fill="#34d399"/>
      <text x="365" y="544" fill="#bbf7d0">Bounded evaluation</text>

      <rect x="524" y="521" width="195" height="36" rx="18" fill="#251641" stroke="#4c1d95"/>
      <circle cx="545" cy="539" r="4" fill="#a78bfa"/>
      <text x="559" y="544" fill="#ddd6fe">Deterministic replay</text>

      <rect x="735" y="521" width="176" height="36" rx="18" fill="#2d1d0b" stroke="#78350f"/>
      <circle cx="756" cy="539" r="4" fill="#f59e0b"/>
      <text x="770" y="544" fill="#fde68a">Digest verified</text>

      <rect x="927" y="521" width="209" height="36" rx="18" fill="#152236" stroke="#334155"/>
      <circle cx="948" cy="539" r="4" fill="#94a3b8"/>
      <text x="962" y="544" fill="#cbd5e1">Python + TypeScript</text>
    </g>
  </g>
</svg>
