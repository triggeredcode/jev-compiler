[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jevcompiler"
version = "0.1.0"
description = "Compile decision policies into inspectable TypeSafe Jev decision graphs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AutoEvolJev contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.scripts]
jevcompiler = "jevcompiler.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.8,<1",
]

[project.urls]
Documentation = "https://docs.typesafe.ai/introduction"

[tool.hatch.build.targets.wheel]
packages = ["src/jevcompiler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
