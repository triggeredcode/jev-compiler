[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jevcompiler"
dynamic = ["version"]
description = "Compile decision policies into inspectable TypeSafe Jev decision graphs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AutoEvolJev contributors" }]
keywords = ["decision-systems", "jev", "typesafe", "workflow-compiler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.scripts]
jevcompiler = "jevcompiler.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/triggeredcode/jev-compiler"
Repository = "https://github.com/triggeredcode/jev-compiler"
Documentation = "https://github.com/triggeredcode/jev-compiler/tree/main/docs"
Issues = "https://github.com/triggeredcode/jev-compiler/issues"
Changelog = "https://github.com/triggeredcode/jev-compiler/blob/main/CHANGELOG.md"
"TypeSafe API documentation" = "https://docs.typesafe.ai/introduction"

[tool.hatch.version]
path = "src/jevcompiler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jevcompiler"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
